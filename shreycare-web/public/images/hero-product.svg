<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-label="ShreyCare Organics botanical hair oil bottle resting on a stone with herbs">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F3ECDB"/>
      <stop offset="1" stop-color="#E7DEC9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.5">
      <stop offset="0" stop-color="#C7A86A" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#C7A86A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C7BC9F"/>
      <stop offset="1" stop-color="#A99C7E"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8A5E28"/>
      <stop offset="0.18" stop-color="#C79A57"/>
      <stop offset="0.5" stop-color="#E0B87A"/>
      <stop offset="0.62" stop-color="#C79A57"/>
      <stop offset="1" stop-color="#7C5322"/>
    </linearGradient>
    <linearGradient id="neck" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9A6E33"/>
      <stop offset="0.5" stop-color="#D2AA6E"/>
      <stop offset="1" stop-color="#8A5E28"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1C2C22"/>
      <stop offset="0.5" stop-color="#31503D"/>
      <stop offset="1" stop-color="#1C2C22"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9C7A45"/>
      <stop offset="0.5" stop-color="#C7A86A"/>
      <stop offset="1" stop-color="#8A6A38"/>
    </linearGradient>
    <linearGradient id="label" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7F2E7"/>
      <stop offset="1" stop-color="#EBE1CD"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B5A44"/>
      <stop offset="1" stop-color="#24382C"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="softer" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <!-- backdrop -->
  <rect width="800" height="1000" fill="url(#bg)"/>
  <ellipse cx="400" cy="470" rx="360" ry="360" fill="url(#glow)"/>

  <!-- stone slab -->
  <ellipse cx="400" cy="838" rx="320" ry="52" fill="#00000022" filter="url(#softer)"/>
  <ellipse cx="400" cy="812" rx="308" ry="60" fill="url(#stone)"/>
  <ellipse cx="400" cy="800" rx="308" ry="54" fill="#D8CDB2" opacity="0.5"/>

  <!-- bottle contact shadow -->
  <ellipse cx="404" cy="792" rx="132" ry="26" fill="#24382C" opacity="0.28" filter="url(#soft)"/>

  <!-- botanicals behind, left -->
  <g transform="translate(250 720) rotate(-24)">
    <path d="M0 0 C 26 -18 42 -52 40 -104 C 8 -80 -12 -44 0 0 Z" fill="url(#leaf)"/>
    <path d="M20 -52 C 34 -42 52 -46 70 -70 C 44 -70 30 -66 20 -52 Z" fill="#3B5A44"/>
    <line x1="6" y1="-6" x2="34" y2="-92" stroke="#5C7A5A" stroke-width="2" opacity="0.5"/>
  </g>
  <!-- botanicals behind, right -->
  <g transform="translate(548 726) rotate(22) scale(-1,1)">
    <path d="M0 0 C 26 -18 42 -52 40 -104 C 8 -80 -12 -44 0 0 Z" fill="url(#leaf)"/>
    <path d="M20 -52 C 34 -42 52 -46 70 -70 C 44 -70 30 -66 20 -52 Z" fill="#3B5A44"/>
    <line x1="6" y1="-6" x2="34" y2="-92" stroke="#5C7A5A" stroke-width="2" opacity="0.5"/>
  </g>

  <!-- dropper bulb -->
  <rect x="380" y="196" width="40" height="70" rx="18" fill="url(#wood)"/>
  <rect x="386" y="202" width="10" height="52" rx="5" fill="#E4CE9E" opacity="0.6"/>
  <!-- cap collar -->
  <rect x="356" y="262" width="88" height="46" rx="12" fill="url(#cap)"/>
  <rect x="356" y="262" width="88" height="12" rx="6" fill="#4C6B56" opacity="0.7"/>
  <!-- glass neck -->
  <rect x="368" y="300" width="64" height="70" fill="url(#neck)"/>

  <!-- bottle body -->
  <path d="M320 372
           Q320 356 340 352
           L460 352
           Q480 356 480 372
           L484 720
           Q484 792 400 792
           Q316 792 320 720
           Z" fill="url(#glass)"/>
  <!-- body highlight -->
  <path d="M346 380 Q338 560 356 740" stroke="#F4E4C4" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.35"/>
  <path d="M452 384 Q462 560 448 720" stroke="#5A3C18" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.35"/>

  <!-- label -->
  <rect x="342" y="452" width="116" height="248" rx="16" fill="url(#label)"/>
  <rect x="342" y="452" width="116" height="248" rx="16" fill="none" stroke="#D9CBAE" stroke-width="1.5"/>
  <!-- label leaf mark -->
  <g transform="translate(400 500)">
    <path d="M0 0 C 10 -8 14 -22 0 -34 C -14 -22 -10 -8 0 0 Z" fill="#24382C"/>
    <path d="M0 -6 L 0 8" stroke="#24382C" stroke-width="2"/>
  </g>
  <text x="400" y="548" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="600" fill="#24382C" letter-spacing="0.5">ShreyCare</text>
  <text x="400" y="570" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#8A6D3C" letter-spacing="4">ORGANICS</text>
  <line x1="368" y1="586" x2="432" y2="586" stroke="#C7A86A" stroke-width="1"/>
  <text x="400" y="618" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-style="italic" fill="#54604F">Botanical</text>
  <text x="400" y="640" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-style="italic" fill="#54604F">Hair Oil</text>
  <text x="400" y="676" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#8A8570" letter-spacing="1">BHRINGRAJ · AMLA</text>

  <!-- foreground scattered petals / seeds -->
  <g opacity="0.9">
    <ellipse cx="250" cy="800" rx="16" ry="9" fill="#7C3B34" transform="rotate(-18 250 800)"/>
    <ellipse cx="286" cy="812" rx="13" ry="7" fill="#9A4A40" transform="rotate(12 286 812)"/>
    <circle cx="150" cy="806" r="5" fill="#6E5A2E"/>
    <circle cx="168" cy="816" r="5" fill="#7E6836"/>
    <circle cx="184" cy="808" r="4" fill="#6E5A2E"/>
  </g>
  <g opacity="0.9">
    <ellipse cx="556" cy="804" rx="15" ry="8" fill="#8A4038" transform="rotate(16 556 804)"/>
    <circle cx="620" cy="812" r="5" fill="#6E5A2E"/>
    <circle cx="636" cy="806" r="4" fill="#7E6836"/>
  </g>

  <!-- small herb sprig front right -->
  <g transform="translate(600 780) rotate(30)">
    <line x1="0" y1="0" x2="0" y2="-70" stroke="#3B5A44" stroke-width="3"/>
    <path d="M0 -18 C 14 -22 22 -30 24 -44 C 10 -40 2 -30 0 -18 Z" fill="#3B5A44"/>
    <path d="M0 -34 C -14 -38 -22 -46 -24 -60 C -10 -56 -2 -46 0 -34 Z" fill="#24382C"/>
    <path d="M0 -50 C 12 -54 20 -62 22 -74 C 8 -70 2 -62 0 -50 Z" fill="#3B5A44"/>
  </g>
</svg>
